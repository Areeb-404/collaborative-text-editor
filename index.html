<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presence And User Awareness</title>
  <style>
    .presence-bar {
      margin: 10px 0;
      padding: 8px 12px;
      background-color: #f0f4f8;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 14px;
    }

    .user-tag {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 5px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h2>Collaborative Text Editor</h2>

  <label for="doc_id_input">Document ID: </label>
  <input type="number" id="doc_id_input" value="1">
  <button id="connect_btn">Connect to Room</button>

  <div class="presence-bar">
    <strong>Active Users (<span id="user_count">0</span>):</strong>
    <span id="user_list">Disconnected</span>
  </div>

  <br><br>

  <textarea id="editor_textarea" cols="60" rows="12"></textarea>

  <script>
    const docIdInput = document.getElementById("doc_id_input");
    const connect_btn = document.getElementById("connect_btn");
    const editor_textarea = document.getElementById("editor_textarea")
    const user_count_span = document.getElementById("user_count")
    const user_list_span = document.getElementById("user_list")
    let ws = null;

    // helper function to update content while preserving cursor position
    function UpdateContentandPreserveCursor(newContent) {
      const textarea = document.getElementById("editor_textarea");
      const oldcontent = textarea.value;

      //1. If there is no new content, do nothing
      if (oldcontent == newContent) return;

      //2. Check if this tab's textarea is currently focused
      const isfocused = (document.activeElement === textarea);

      if (isfocused) {
        let start = textarea.selectionStart;
        let end = textarea.selectionEnd;

        //3. Find length of common prefix
        let prefixLen = 0;
        const minlen = Math.min(oldcontent.length, newContent.length);
        while (prefixLen < minlen && oldcontent[prefixLen] === newContent[prefixLen]) {
          prefixLen++;
        }


        //4. Find length of common suffix
        let suffixLen = 0;
        while (
          suffixLen < (minlen - prefixLen) &&
          oldcontent[oldcontent.length - 1 - suffixLen] === newContent[newContent.length - 1 - suffixLen]
        ) {
          suffixLen++;
        }

        //5. Find out the change offset and total character difference
        const changeStart = prefixLen;
        const deletedLen = oldcontent.length - prefixLen - suffixLen;
        const insertedLen = newContent.length - prefixLen - suffixLen;
        const delta = insertedLen - deletedLen;

        //6. Adjust cursor position if the edit occured at or before the current cursor position
        if (changeStart <= start) {
          start = Math.max(changeStart, start + delta);
        }
        if (changeStart <= end) {
          end = Math.max(changeStart, end + delta);
        }

        //7. Update text and restore adjusted section
        textarea.value = newContent;
        textarea.setSelectionRange(start, end);
      }

      // if the tab is unfocused, simply update the value without resetting carets
      textarea.value = newContent;
    }

    connect_btn.addEventListener("click", () => {
      const doc_id = docIdInput.value
      if (!doc_id) return;
      if (ws) ws.close();

      ws = new WebSocket(`ws://localhost:8000/ws/${doc_id}`);

      ws.onopen = () => {
        console.log(`Connect to Document Room ${doc_id}`)
        editor_textarea.disabled = false
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "init" || data.type === "update") {
            UpdateContentandPreserveCursor(data.content);
          }
          else if (data.type === "presence") {
            user_count_span.textContent = data.count;
            user_list_span.innerHTML = data.users
              .map(u => `<span class="user-tag"> ${u.name} </span>`)
              .join(" ");
          }
        }
        catch (e) {
          // plain text broadcast update from other clients.
          UpdateContentandPreserveCursor(event.data);
        }
      };

      ws.onclose = () => {
        console.log("Disconnected From Room.")
        editor_textarea.disabled = true;
        user_count_span.textContent = 0;
        user_list_span.textContent = "Disconnected";
      };
    });

    editor_textarea.addEventListener("input", () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "update",
          content: editor_textarea.value
        }))
      }
    })

  </script>
</body>

</html>
