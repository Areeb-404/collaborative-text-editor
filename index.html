<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presence And User Awareness</title>
  <style>
    .presence-bar {
      margin: 10px 0;
      padding: 8px 12px;
      background-color: #f0f4f8;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 14px;
    }

    .user-tag {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 5px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h2>Collaborative Text Editor</h2>

  <label for="doc_id_input">Document ID: </label>
  <input type="number" id="doc_id_input" value="1">
  <button id="connect_btn">Connect to Room</button>

  <div class="presence-bar">
    <strong>Active Users (<span id="user_count">0</span>):</strong>
    <span id="user_list">Disconnected</span>
  </div>

  <br><br>

  <textarea id="editor_textarea" cols="60" rows="12" disabled></textarea>

  <script>
    const docIdInput = document.getElementById("doc_id_input");
    const connectBtn = document.getElementById("connect_btn");
    const editor = document.getElementById("editor_textarea");
    const userCountSpan = document.getElementById("user_count");
    const userListSpan = document.getElementById("user_list");

    let ws = null;
    let clientId = null;    // the server tells us who we are
    let items = [];        // the CRDT: [{key, char, client_id}], always sorted
    let lastText = "";    // what the textarea showed after our last update
    let currentUsers = [];
    let remoteCursors = {}; // stores the current caret position for each user


    let ReconnectAttempts = 0;
    const maxReconnectDelay = 10000; // capping the reconnect delay at 10 second ie 10000 ms
    let reconnectTimeout = null;

    function compare(a, b) {
      if (a.key !== b.key) return a.key < b.key ? -1 : 1;
      if (a.client_id !== b.client_id) return a.client_id < b.client_id ? -1 : 1;
      return 0;
    }
    const sameId = (a, b) => a.key === b.key && a.client_id === b.client_id;

    function lowerBound(item) {     // binary search to figure out where the item belongs
      let lo = 0, hi = items.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (compare(items[mid], item) < 0) lo = mid + 1; else hi = mid;
      }
      return lo;
    }

    function keyBetween(left, right) {   // a number between two neighbours ie for 1 and 2 its 1.5
      if (left === null && right === null) return 1;
      if (left === null) return right - 1;
      if (right === null) return left + 1;
      return (left + right) / 2;
    }

    const itemsToText = () => items.map(i => i.char).join("");
    function render() {lastText = itemsToText(); editor.value = lastText;}
    function send(obj) {if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));}


    function applyRemote(op) {
      let idx, shift;
      if (op.type === "insert") {
        const item = {key: op.key, char: op.char, client_id: op.client_id};
        idx = lowerBound(item);
        if (idx < items.length && sameId(items[idx], item)) return;  // already have it 
        items.splice(idx, 0, item);
        shift = +1;
      }
      else {
        idx = items.findIndex(i => sameId(i, op));
        if (idx === -1) return;
        items.splice(idx, 1);
        shift = -1;
      }

      let start = editor.selectionStart, end = editor.selectionEnd;
      if (idx < start) start += shift;
      if (idx < end) end += shift;

      for (const id in remoteCursors) {
        if (idx < remoteCursors[id]) remoteCursors[id] += shift;
      }
      render();
      if (document.activeElement === editor) {
        editor.setSelectionRange(start, end);
        sendCursorPosition();
      }
      renderPresence();
    }

    function renderPresence() {
      userCountSpan.textContent = currentUsers.length;
      userListSpan.textContent = "";

      for (const u of currentUsers) {
        const tag = document.createElement("span");
        tag.className = "user-tag";

        let label = u.name;
        if (u.client_id === clientId) {
          label += " (you)";
        }
        else {
          const pos = remoteCursors[u.client_id];
          if (pos !== undefined) label += ` (at ${pos})`;
        }
        tag.textContent = label;

        if (u.color) {
          tag.style.backgroundColor = u.color;
        }
        userListSpan.appendChild(tag);
      }

    }


    editor.addEventListener("input", () => {
      const oldText = lastText, newText = editor.value;

      // finding the one changed region, common start + common end
      const min = Math.min(oldText.length, newText.length);
      let p = 0;
      while (p < min && oldText[p] === newText[p]) p++;
      let s = 0;
      while (s < min - p && oldText[oldText.length - 1 - s] === newText[newText.length - 1 - s]) s++;

      const removedCount = oldText.length - p - s;
      const inserted = newText.slice(p, newText.length - s);

      // 1. Deletions
      const gone = items.splice(p, removedCount);
      for (const it of gone) send({type: "delete", key: it.key, client_id: it.client_id});

      // 2. Insertions 
      let left = p > 0 ? items[p - 1].key : null;
      const right = p < items.length ? items[p].key : null;
      for (let i = 0; i < inserted.length; i++) {
        const item = {key: keyBetween(left, right), char: inserted[i], client_id: clientId};
        items.splice(lowerBound(item), 0, item);
        left = item.key;
        send({type: "insert", key: item.key, char: item.char, client_id: clientId});
      }

      // safety net
      if (itemsToText() !== newText) {
        render();
        editor.setSelectionRange(p + inserted.length, p + inserted.length);
      }
      else {
        lastText = newText;
      }
    });

    function connect() {
      const docId = docIdInput.value;
      if (!docId) return;
      // clean up any existing connection or pending reconnect timers
      if (ws) ws.close();
      if (reconnectTimeout) clearTimeout(reconnectTimeout);

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const host = "localhost:8000";
      const socket = new WebSocket(`${proto}://${host}/ws/${docId}`);
      ws = socket;

      socket.onmessage = (event) => {
        if (ws !== socket) return;
        const data = JSON.parse(event.data);

        if (data.type === "init") {
          // reset connect attempt count on a successfull init
          ReconnectAttempts = 0;
          clientId = data.client_id;
          items = data.crdt_state;
          render();
          editor.disabled = false;
          lastSentPos = null;
          sendCursorPosition();
        }
        else if (data.type === "insert" || data.type === "delete") {
          applyRemote(data);
        }
        else if (data.type === "presence") {
          currentUsers = data.users;
          renderPresence();
        }
        else if (data.type === "cursor") {
          remoteCursors[data.client_id] = data.position;
          renderPresence();
        }
      }
      socket.onclose = () => {
        if (ws !== socket) return;
        editor.disabled = true;
        lastSentPos = null;
        userListSpan.textContent = "Disconnected";
        userCountSpan.textContent = 0;
        const delay = Math.min(1000 * Math.pow(2, ReconnectAttempts), maxReconnectDelay);
        console.log(`Connection dropped. Reconnecting in ${delay / 1000}s.... (Attempt ${ReconnectAttempts + 1})`)
        ReconnectAttempts++;

        // schedule the next reconnect attempt 
        reconnectTimeout = setTimeout(() => {
          connect();
        }, delay);
      };
    }

    connectBtn.addEventListener("click", () => {
      ReconnectAttempts = 0; // clicking the button resets the automatic attempts
      connect();
    });

    let lastSentPos = null;

    function sendCursorPosition() {
      if (!ws || ws.readyState != WebSocket.OPEN) return;

      const pos = editor.selectionStart
      if (pos === lastSentPos) return;
      lastSentPos = pos

      send({
        type: "cursor",
        position: pos
      });
    }

    ["keyup", "click", "select", "mouseup", "focus", "input"].forEach(eventType => {
      editor.addEventListener(eventType, sendCursorPosition);
    });

    editor.addEventListener("keydown", () => setTimeout(sendCursorPosition, 0));

  </script>
</body>

</html>
