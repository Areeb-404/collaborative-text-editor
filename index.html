<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <title>Phase 2.2 - Document Room Sync</title>
    </head>
    <body>
        <h2>Collaborative Text Editor</h2>

        <label for="doc_id_input">Document ID: </label>
        <input type="number" id="doc_id_input" value="1">
        <button id="connect_btn">Connect to Room</button>

        <br><br>
        
        <textarea id="editor_textarea" cols="60" rows="12"></textarea>

        <script>
            const docIdInput = document.getElementById("doc_id_input");
            const connect_btn = document.getElementById("connect_btn");
            const editor_textarea = document.getElementById("editor_textarea")
            let ws = null;


            connect_btn.addEventListener("click",() => {
                const doc_id = docIdInput.value
                if(!doc_id) return;
                if(ws) ws.close();
                
                ws = new WebSocket(`ws://localhost:8000/ws/${doc_id}`);

                ws.onopen = () => {
                    console.log(`Connect to Document Room ${doc_id}`)
                    editor_textarea.disabled = false
                };

                ws.onmessage = (event) => {
                    try{
                        const data = JSON.parse(event.data);
                        if(data.type === "init"){
                            editor_textarea.value = data.content;
                        }
                    }
                    catch(e){
                        // plain text broadcast update from other clients.
                        editor_textarea.value = event.data;
                    }
                };

                ws.onclose = () => {
                    console.log("Disconnected From Room.")
                    editor_textarea.disabled = true;
                };
            });

            editor_textarea.addEventListener("input", () => {
                if (ws && ws.readyState === WebSocket.OPEN){
                    ws.send(JSON.stringify({
                        type: "update",
                        content: editor_textarea.value
                }))
                }
            })            

       </script>
    </body>
</html>
